
name: Extract Ashkadan Website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          mkdir .extract
          unzip -q "$ZIP" -d .extract

          if [ -f .extract/index.html ]; then
            cp -a .extract/. .
          else
            FIRST=$(find .extract -mindepth 1 -maxdepth 1 | head -n 1)
            if [ -d "$FIRST" ] && [ -f "$FIRST/index.html" ]; then
              cp -a "$FIRST"/. .
            else
              cp -a .extract/. .
            fi
          fi

          rm -rf .extract

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract final Ashkadan website"
          git push
          
